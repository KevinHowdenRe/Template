<!DOCTYPE html>
<html lang="fr" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Login · Base UI</title>

     <!-- Core CSS -->
	<link rel="stylesheet" href="../css/base.css">
    

</head>


<body>

<div class="app">

    <!-- HEADER -->

   <header class="header">

        <a href="index.html"
           class="header-brand">
            Base UI
        </a>


        <nav class="header-nav">

            <a href="../index.html" class="active">
                Home
            </a>
			
			<a href="dashboard.html" class="active">
                Dashboard
            </a>

          
            <a href="blog.html" class="active">
                Blog
            </a>
                
            <a href="portfolio.html" class="active">
                Portfolio
            </a>
			
			
			<a href="login.html" class="active">
                 Login
            </a>
			
			<a href="account.html" class="active">
                 Account
            </a>
<button onclick="switchLight()" id="interrupteur" class="theme-toggle" id="theme-toggle" aria-label="Switch theme">
    ☾ 
</button>

        </nav>

    </header>



    <!-- LOGIN -->

    <main
        class="page"
        style="
            min-height: calc(100vh - var(--header-height));
            display: flex;
            align-items: center;
            justify-content: center;
        "
    >

        <div style="width: 100%; max-width: 420px;">

            <div style="margin-bottom: 32px;">

                <span class="badge">
                    Welcome
                </span>

                <h1 style="margin-top: 20px; margin-bottom: 8px;">
                    Sign in.
                </h1>

                <p class="text-secondary mb-0">
                    Enter your account details to continue.
                </p>

            </div>


            <form>

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        id="email"
                        type="email"
                        placeholder="name@example.com"
                        autocomplete="email"
                    >

                </div>


                <div class="form-group">

                    <div class="flex justify-between items-center">

                        <label for="password">
                            Password
                        </label>

                        <a href=#>
                            Forgot password?
                        </a>

                    </div>

                    <input
                        id="password"
                        type="password"
                        placeholder="Your password"
                        autocomplete="current-password"
                    >

                </div>


                <button
                    type="button"
                    class="btn btn-primary w-full"
                    style="margin-top: 8px;">
                    Sign in
                </button>

            </form>


            <div
                class="text-center text-small text-secondary"
                style="margin-top: 28px;"
            >
                Don't have an account?
                <a href="#">
                    Create an account
                </a>
            </div>

        </div>

    </main>

</div>


<script src="../js/base.js"></script>


</body>
</html>
